[project]
name = "practicare-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.2",
    "fastapi[standard]>=0.128.0",
    "phonenumbers>=9.0.21",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "sqlalchemy[asyncio] (>=2.0.45,<3.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)",
    "flower>=2.0.1",
    "celery>=5.6.2",
    "redis>=7.1.0",
]

[dependency-groups]
dev = [
    "testcontainers>=4.13.3",
    "freezegun>=1.5.5",
    "pytest>=9.0.2",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "ruff>=0.14.10",
    "taskipy>=1.14.1",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
]


[tool.ruff]
line-length = 79
extend-exclude = ['alembic/versions', 'migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'double'

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = '-p no:warnings'
asyncio_default_fixture_loop_scope = "function"

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'fastapi dev src/main.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=src -vv'
post_test = 'coverage html'
celery = 'celery -A src.celery_app.celery_app worker --loglevel=INFO --pool=solo'
flower = 'celery -A src.celery_app flower'

[tool.coverage.run]
core = "ctrace"
concurrency = ["thread", "greenlet"]
