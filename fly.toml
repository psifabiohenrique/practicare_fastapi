# fly.toml app configuration file generated for practicare-fastapi on 2026-01-18T17:59:45-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'practicare-fastapi'
primary_region = 'gru'

[build]

[processes]
  web = 'fastapi run src/main.py --host 0.0.0.0 --port 8000'
  worker = "celery -A src.celery_app worker -l info --concurrency=2"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['web']

[[vm]]
  memory = '512'
  cpu_kind = 'shared'
  cpus = 1
